<!DOCTYPE html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>HI THERE!</title>
    <style>
        body {
            background-color: #191919;
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
            font-optical-sizing: auto;
            font-weight: 300;
            font-style: normal;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .greeting_box {
            background-color: #383838;
            height: clamp(50px, 5vh, 10vh);
            width: 100%;
            border-radius: clamp(5px, 10px, 50vh);
            padding: 10px 1.5rem;
            display: flex;
            align-items: center;
        }

        .greeting_text {
            font-size: clamp(1vh, 24px, 50vh);
            color: #D4D4D4;
            margin-left: 10px;
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <div class="greeting_box">
        <div class="greeting_text"></div>
    </div>

    <script>
        const greetings = [
            "☀️ Morning!",
            "☕ Good Afternoon!",
            "🌇 Good Evening!",
            "🌙 Good Night!",
            "💤 Night night!",
            "🎂🎈 Happy Birthday!"
        ];

        const box = document.querySelector('.greeting_text');

        function tick() {
            const now = new Date(); // Always get the current time
            const hour = now.getHours();
            const month = now.getMonth(); // 0-indexed: 10 = November
            const date = now.getDate();  // Fixed: getDate() for day of month, not getDay()

            if (month === 10 && date === 8) {
                box.textContent = greetings[5];
            } else if (hour >= 6 && hour < 12) {
                box.textContent = greetings[0];
            } else if (hour >= 12 && hour < 17) {
                box.textContent = greetings[1];
            } else if (hour >= 17 && hour < 19) {
                box.textContent = greetings[2];
            } else if (hour >= 19 && hour < 22) {
                box.textContent = greetings[3];
            } else {
                box.textContent = greetings[4];
            }
        }

        tick();
        setInterval(tick, 1000); // Update every second
    </script>
</body>
